aid: brown-brown
name: Brown & Brown
review:
  question: Does Brown & Brown expose a public, self-serve developer portal or documented API?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: broker-intermediary
  gated: true
findings:
  summary: |
    Brown & Brown, Inc. (NYSE: BRO) is a US retail and specialty insurance
    brokerage — a distributor, not a carrier — and it publishes no public API
    surface of any kind. There is no developer portal, no API reference, no
    downloadable OpenAPI/Swagger, no public Postman workspace, no GraphQL
    endpoint, no published .proto, and no event/webhook catalog on any
    first-party Brown & Brown property.

    The four canonical developer hostnames do not exist in DNS at all:
    developer.bbrown.com, developers.bbrown.com, docs.bbrown.com and
    api.bbrown.com all fail to resolve (NXDOMAIN — no A record). Every
    developer-shaped path on the marketing site returns 404: /developers, /api,
    /developer, /partners and /integrations, on both bbrown.com and
    us.bbrown.com. The corporate site is a WordPress install on WP Engine behind
    Cloudflare with region-partitioned content (bbrown.com/us/, bbrown.com/uk/,
    bbrown.com/ie/); its WordPress REST API is not publicly reachable
    (/wp-json/wp/v2/posts returns 404) and there is no RSS feed exposed for the
    /blog/ section.

    A subdomain enumeration of bbrown.com surfaced roughly 35 hosts, and every
    application host is a login wall rather than a developer surface —
    ratings.bbrown.com redirects to Microsoft Entra ID (login.microsoftonline.com,
    tenant f1289cc5-8456-4f28-8eab-700d1300fc5d) via an OIDC authorization-code
    flow, accidentclaims.bbrown.com is a third-party (ABL Group) claimant login,
    cyberapp.bbrown.com is a rebadged Centraleyes GRC tenant, and bbwrite.bbrown.com
    and legalentity.bbrown.com are Cloudflare-challenged. None of these is a
    developer portal under any reading; none carries reference documentation.

    The only genuine programmatic surface anywhere in the group is partner-gated
    and belongs to a subsidiary. Arrowhead Programs — part of Brown & Brown's
    Specialty Distribution segment, now branded within Arrowhead Intermediaries
    alongside Bridge Specialty Group and One80 Intermediaries — describes a
    "strategic API team" and an Enterprise API (EAPI) layered over the Arrowhead
    Exchange agent platform. It is a QUOTE integration: an agent-facing rating
    call distributed through comparative raters and aggregators (CoverHound,
    Tarmika, Semsee, and DAIS), delivered by commercial agreement with each
    distributor. It is not consumer-facing, not self-serve, and has no public
    documentation, no published base URL, and no specification. arrowheadexchange.com
    serves a login-gated Angular single-page application; api.arrowheadexchange.com
    resolves through Cloudflare but returns HTTP 404 for the root and for every
    probed spec path (/openapi.json, /openapi.yaml, /swagger.json,
    /swagger/v1/swagger.json, /v1/openapi.json, /api-docs, /docs, /spec, /redoc,
    /swagger, /health, /.well-known/openid-configuration). A gateway host exists;
    nothing public is served from it.

    ACORD posture: no reference to ACORD, AL3, ACORD XML, ACORD certification or
    NGDS appears on any Brown & Brown first-party web property, and none appears
    in the Arrowhead API material. The company's actual carrier data exchange
    runs where it runs for essentially all US retail brokerage — through the
    agency management system layer. Brown & Brown is a publicly referenced
    Vertafore AMS360 agency (Vertafore, May 2025, credited Brown & Brown with
    building centralized service centers on AMS360 and with helping shape the
    product), and AMS360-class systems carry carrier policy download over IVANS
    in ACORD AL3 / ACORD XML. That plumbing belongs to the AMS vendor and the
    carriers, not to an interface Brown & Brown publishes. Recorded honestly:
    no ACORD reference published by the company itself.

    Of the four insurance API verbs — quote, bind, issue, FNOL — only QUOTE is
    exposed programmatically, and only partner-to-partner through the Arrowhead
    EAPI. Bind, issue and FNOL are not exposed via any documented API; claims
    intake runs through gated portals and through the carriers on whose paper the
    risk sits. This is the expected shape for a US broker-intermediary: with no
    federal regulator and no open-insurance mandate, nothing forces publication,
    and the distributor's integration value is captured by the agency management
    system and the aggregator layer rather than by a broker-published API.
