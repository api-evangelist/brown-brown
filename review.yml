  specs:
    openapiHarvested: false
    count: 0
    note: |
      No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or .proto artifact was found on
      any Brown & Brown or Arrowhead property. Every candidate spec path probed
      on the one live API host (api.arrowheadexchange.com) returned 404. The
      openapi/ directory is deliberately absent from this repo — there is
      nothing real to save.
  acordPosture:
    phrase: No ACORD reference published; exchange runs via Vertafore AMS360 / IVANS agency download
    acordNamed: false
    al3: false
    acordXML: false
    ngds: false
    ivans: indirect
    agencyManagementSystem: Vertafore AMS360
    note: |
      Searched Brown & Brown first-party properties and the Arrowhead subsidiary
      material for ACORD, AL3, ACORD XML, ACORD certified, NGDS, IVANS, agency
      download, Applied Epic and Vertafore. Nothing published by the company
      names ACORD. The one confirmed AMS fact is external and vendor-published:
      Vertafore (May 14, 2025) publicly credited Brown & Brown with building
      centralized service centers on AMS360 and with helping shape the product.
      IVANS/ACORD AL3 download is a property of that AMS tier, not of a
      Brown & Brown interface, and is recorded here as indirect.
  insuranceVerbs:
    quote:
      exposed: true
      audience: partner-only
      note: Arrowhead Programs Enterprise API (EAPI) over the Arrowhead Exchange platform, consumed by comparative raters and aggregators (CoverHound, Tarmika, Semsee, DAIS). No public docs, base URL or spec.
    bind:
      exposed: false
      note: Not documented on any public surface.
    issue:
      exposed: false
      note: Not documented on any public surface.
    fnol:
      exposed: false
      note: No public FNOL API. Claims intake is via gated portals (e.g. accidentclaims.bbrown.com) and via the carriers on whose paper the risk sits.
  authModel:
    publicApiAuth: none
    note: |
      No public API means no published authentication scheme. Observed portal
      authentication is OIDC/SAML federation to Microsoft Entra ID for internal
      and teammate-facing applications (ratings.bbrown.com authorization-code
      flow against login.microsoftonline.com), plus separate third-party vendor
      logins for claims and GRC applications. No anonymous
      /.well-known/openid-configuration or /.well-known/oauth-authorization-server
      document is served on bbrown.com or api.arrowheadexchange.com. Arrowhead
      EAPI credentialing is not disclosed publicly.
  webhooks:
    exists: false
    asyncapi: false
    note: No event catalog, webhook documentation or AsyncAPI artifact found. Absence is the finding.
  postman:
    publicWorkspace: false
    note: Postman public search returned no Brown & Brown, Arrowhead, Bridge Specialty or One80 workspace or collection.
  graphql:
    exists: false
    note: No /graphql surface found on bbrown.com, us.bbrown.com or arrowheadexchange.com.
  grpc:
    exists: false
    note: No published .proto.
  sdks:
    exists: false
    note: |
      No first-party SDKs. github.com/brown-and-brown exists but is an
      unattributed org (no name, description, blog or location set, 3 repos) and
      could not be verified as belonging to Brown & Brown, Inc.; it is
      deliberately not recorded in apis.yml.
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: A REST gateway host exists at api.arrowheadexchange.com (Cloudflare, 404 on all probed paths) serving the partner-gated Arrowhead EAPI. Nothing about it is publicly documented.
  - protocol: HTML
    scheme: https
    documented: true
    note: Marketing and investor content only. This is the entirety of Brown & Brown's public web surface.
  - protocol: EDI/AL3
    scheme: ivans
    documented: false
    note: Indirect — carrier download reaches Brown & Brown through the Vertafore AMS360 agency management system, not through any Brown & Brown-published interface.
  - protocol: GraphQL
    documented: false
  - protocol: WebSocket
    scheme: wss
    documented: false
  - protocol: gRPC
    documented: false
marketSeam:
  market: United States
  regulator: none (state-by-state under NAIC model laws; McCarran-Ferguson)
  openInsuranceMandate: false
  note: |
    The US has no federal insurance regulator and no open-insurance mandate, so
    nothing compels a broker or carrier to publish anything. Data exchange has
    run since the 1970s on ACORD standards in an EDI/forms idiom moved by
    agency-download plumbing (IVANS) between carriers and agency management
    systems. Brown & Brown is a textbook confirmation of the consequence: the
    fifth-largest US independent brokerage, $1.9B in Q1 2026 revenue, and zero
    public API surface. The integration value sits with the AMS vendors
    (Vertafore, Applied), the aggregators (CoverHound, Tarmika, Semsee, DAIS)
    and the risk-data layer — not with the intermediary.
