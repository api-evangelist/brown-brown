name: Brown & Brown
kind: company
description: >-
  Brown & Brown, Inc. (NYSE: BRO) is a Daytona Beach, Florida headquartered
  insurance brokerage and risk-management intermediary founded in 1939, and one
  of the largest independent brokers in the United States. Following the 2025
  acquisition of Accession Risk Management Group (Risk Strategies and One80
  Intermediaries), it reports through two segments: Retail — property and
  casualty insurance, employee benefits, private client, captive solutions and
  financial/wealth services — and Specialty Distribution — programs, wholesale
  brokerage and MGA/binding-authority businesses including Arrowhead. As a
  distributor rather than a carrier, Brown & Brown places risk with insurers
  instead of underwriting it, and its US home market has no federal insurance
  regulator and no open-insurance mandate. Its API posture reflects that
  honestly: Brown & Brown publishes no public developer portal and no
  self-serve API. developer.bbrown.com, developers.bbrown.com, docs.bbrown.com
  and api.bbrown.com do not resolve, and every /developers, /api, /partners and
  /integrations path returns 404. Every discoverable application subdomain is a
  login wall — agent, client and vendor portals behind Microsoft Entra ID SSO or
  third-party sign-in. The only real programmatic surface is partner-gated: the
  Arrowhead Programs "Enterprise API" (EAPI), a quoting integration distributed
  through comparative raters and aggregators such as CoverHound, Tarmika, Semsee
  and DAIS, with no public documentation, base URL or specification. No ACORD,
  AL3, ACORD XML or NGDS reference is published on any Brown & Brown first-party
  property; carrier data exchange runs, as it does across US retail brokerage,
  through the agency management system layer — Brown & Brown is a publicly
  referenced Vertafore AMS360 agency — and IVANS agency download rather than
  through any API Brown & Brown itself exposes. In July 2026 the company
  announced an AI-first transformation with Anthropic, McKinsey and Accenture,
  deploying Claude across 23,000 teammates and Claude Code across its software
  engineering organization; that is internal adoption and has so far produced no
  external API, developer portal or agent-facing surface. The only
  machine-readable documents Brown & Brown publishes are two RSS feeds — the
  blog and investor news releases.
